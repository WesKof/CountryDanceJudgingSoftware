<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Competition Judging Software</title>    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="js/utils.js" defer></script>
    <script src="js/tableHandlers.js" defer></script>
    <script src="js/eventHandlers.js" defer></script>
    <script src="js/resultsHandlers.js" defer></script>
    <script src="js/exportHandlers.js" defer></script>
    <script src="js/winnersTable.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-7xl">
        <h1 class="text-2xl font-bold mb-4 text-center custom-header">Dance Competition Judging Software</h1>
        
        <!-- Data Table Section -->
        <div id="tableContainer" class="table-container">
            <table id="dataTable" class="table-auto min-w-full divide-y divide-gray-200 hidden">
                <thead class="bg-gray-50">
                    <tr id="headerRow"></tr>
                </thead>
                <tbody id="dataBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-4 flex justify-center space-x-2 hidden">
            <button id="prevPage" class="custom-button text-white font-bold py-1 px-3 rounded">Previous</button>
            <span id="pageInfo" class="text-sm text-gray-700"></span>
            <button id="nextPage" class="custom-button text-white font-bold py-1 px-3 rounded">Next</button>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="text-red-500 mt-4 hidden text-center"></div>

        <!-- Results Section -->
        <div id="resultsContainer" class="mt-8 w-full flex flex-col items-center hidden">
            <h2 class="text-xl font-bold mb-2 custom-header text-center">Results</h2>
            <div class="table-container">
                <table id="resultsTable" class="table-auto min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer" data-sort="division">Division</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer" data-sort="lead">Lead</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer" data-sort="follow">Follow</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer" data-sort="leadNumber">Lead Number</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer" data-sort="totalScore">Total Score</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <!-- Export Buttons -->
        <div class="mt-6 flex justify-center space-x-4">
            <button id="exportResults" class="custom-button text-white font-bold py-2 px-4 rounded hidden">
                Export Results to Excel
            </button>
            <button id="publishResults" class="custom-button text-white font-bold py-2 px-4 rounded hidden">
                Publish Results to Google Sheet
            </button>
            <button id="exportResultsCsv" class="custom-button text-white font-bold py-2 px-4 rounded hidden">
                Export Results to CSV
            </button>
        </div>

        <!-- Export/Publish Error Message -->
        <div class="mt-2 flex justify-center">
            <span id="exportPublishError" class="text-red-600 text-sm font-bold hidden"></span>
        </div>    </div>
</body>
</html>
