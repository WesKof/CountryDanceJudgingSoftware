packages:
  - .

overrides:
  # Remove/reassess when Vinext no longer pins the affected parser.
  'vinext@1.0.0-beta.3>image-size': 2.0.3
  # External Miniflare host transport only; remove/reassess when this parent supports fixed Undici.
  'miniflare@4.20260515.0>undici': 7.30.1

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
